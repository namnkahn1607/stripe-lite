openapi: 3.0.3
info:
  title: Stripe-lite API Gateway
  description: |
    Production-grade baseline API specification for the Stripe-lite payment gateway.
    Adheres strictly to RFC 9457 Problem Details for all HTTP error representations.
  version: 1.0.0
  contact:
    name: Core Platform Architecture Team
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /v1
    description: Baseline v1 API gateway prefix

security: []

tags:
  - name: System
    description: Observability, telemetry, and health probe endpoints.
  - name: Authentication & Identity
    description: "Merchant identity, dashboard sessions, and scoped token management (Domain Owner: Khánh)."
  - name: Merchant Management
    description: "Merchant accounts, profile settings, and registration."
  - name: API Keys
    description: "Secret API key provisioning, listing, and lifecycle management."
  - name: Customer Management
    description: "Customer accounts, profiles, and metadata records."
  - name: Payments & Core Engine
    description: "Core payment intents, charges, refunds, and ledger operations (Domain Owner: Long)."
  - name: Webhooks
    description: "Webhook subscriptions, signature verifications, and event dispatch (Domain Owner: Sơn)."

paths:
  /healthz:
    get:
      summary: Health check probe
      description: Returns service operational readiness and liveness status.
      operationId: getHealthz
      security: []
      tags:
        - System
      responses:
        "200":
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          description: Malformed probe parameters.
          content:
            application/problem+json:
              schema:
                $ref: "./components/problem.yaml#/ProblemDocument"
        "503":
          description: Service is degraded or experiencing downstream failures.
          content:
            application/problem+json:
              schema:
                $ref: "./components/problem.yaml#/ProblemDocument"

  /auth/login:
    $ref: "./auth/login.yaml"

  /auth/refresh:
    $ref: "./auth/refresh.yaml"

  /auth/logout:
    $ref: "./auth/logout.yaml"

  /merchants:
    $ref: "./merchants/collection.yaml"

  /merchants/me:
    $ref: "./merchants/me.yaml"

  /api-keys:
    $ref: "./api-keys/collection.yaml"

  /api-keys/{id}:
    $ref: "./api-keys/item.yaml"

  /customers:
    $ref: "./customers/collection.yaml"

  /customers/{id}:
    $ref: "./customers/item.yaml"

  /payment-intents:
    $ref: "./payments/payment_intents.yaml"

  /webhook-endpoints:
    $ref: "./webhooks/endpoints.yaml"

components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Scoped JWT bearer token issued by the identity service for dashboard sessions.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_*
      description: Merchant secret API key (sk_live_* or sk_test_*) for direct server-to-server integration.

  parameters:
    IdempotencyKeyHeader:
      $ref: "./components/headers.yaml#/IdempotencyKeyHeader"
    XRequestIdHeader:
      $ref: "./components/headers.yaml#/XRequestIdHeader"
    TraceparentHeader:
      $ref: "./components/headers.yaml#/TraceparentHeader"
    IfNoneMatchHeader:
      $ref: "./components/headers.yaml#/IfNoneMatchHeader"
    StartingAfter:
      $ref: "./components/pagination.yaml#/StartingAfterQueryParam"
    EndingBefore:
      $ref: "./components/pagination.yaml#/EndingBeforeQueryParam"
    Limit:
      $ref: "./components/pagination.yaml#/LimitQueryParam"

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          example: ok
        timestamp:
          type: string
          format: date-time
          example: "2026-10-23T04:40:00Z"
        version:
          type: string
          example: "1.0.0"

    ProblemDocument:
      $ref: "./components/problem.yaml#/ProblemDocument"
    ErrorItem:
      $ref: "./components/problem.yaml#/ErrorItem"
    InvalidParam:
      $ref: "./components/problem.yaml#/InvalidParam"
