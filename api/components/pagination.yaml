StartingAfterQueryParam:
  name: starting_after
  in: query
  required: false
  description: |
    A cursor for forward pagination indicating after which object ID to fetch.
    Pass the ID of the last item in the previous page.
    Behavior on deleted cursor: Because IDs are monotonic and time-sortable (e.g., cus_<ULID>),
    filtering evaluates `id > starting_after` directly and functions correctly even if the cursor
    record itself was soft-deleted or removed.
  schema:
    type: string
    example: "cus_01HXZ5JABC1234567890123456"

EndingBeforeQueryParam:
  name: ending_before
  in: query
  required: false
  description: |
    A cursor for backward pagination indicating before which object ID to fetch.
    Pass the ID of the first item in the current page to navigate backwards.
    Behavior on deleted cursor: Evaluates `id < ending_before` directly on monotonic sortable IDs.
  schema:
    type: string
    example: "cus_01HXZ5JABC1234567890123456"

LimitQueryParam:
  name: limit
  in: query
  required: false
  description: |
    Number of objects to return (1 to 100). Default is 10.
  schema:
    type: integer
    default: 10
    minimum: 1
    maximum: 100
    example: 10
