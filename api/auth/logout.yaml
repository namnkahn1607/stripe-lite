post:
  summary: Invalidate active refresh token session
  description: |
    Revokes the specified refresh token and terminates the associated session chain.
    Authentication: Possession of the `refresh_token` itself serves as the credential (`security: []`).
    This avoids rejecting logout requests with 401 when the access JWT has expired.
    Idempotency: Always returns 204 No Content, even if the token has already been revoked, does not exist,
    or belongs to another entity, preventing token enumeration and timing leaks.
    Consistency & Cache Bounds:
    - Revocation is immediately persisted to PostgreSQL.
    - Redis cache tombstones are bounded by configured TTL.
    - Logout revokes the refresh token chain; the short-lived access JWT remains valid until its expiration timestamp (`exp`).
  operationId: logout
  tags:
    - Authentication & Identity
  security: []
  parameters:
    - $ref: "../components/headers.yaml#/XRequestIdHeader"
    - $ref: "../components/headers.yaml#/TraceparentHeader"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas.yaml#/LogoutRequest"
  responses:
    "204":
      description: Session successfully invalidated or already revoked (idempotent).
      headers:
        Cache-Control:
          $ref: "../components/headers.yaml#/CacheControlNoStoreResponseHeader"
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
    "400":
      description: Malformed request payload or missing refresh_token.
      headers:
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
    "429":
      description: Too many requests. Rate limit exceeded.
      headers:
        Retry-After:
          $ref: "../components/headers.yaml#/RetryAfterResponseHeader"
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
    "500":
      description: Internal server error.
      headers:
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
