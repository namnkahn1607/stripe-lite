get:
  summary: Retrieve authenticated merchant profile
  description: Returns profile attributes (business name, email, status, currency) for the caller's merchant account.
  operationId: getMerchantMe
  tags:
    - Merchant Management
  security:
    - bearerJwt: []
  parameters:
    - $ref: "../components/headers.yaml#/XRequestIdHeader"
    - $ref: "../components/headers.yaml#/TraceparentHeader"
  responses:
    "200":
      description: Merchant profile retrieved successfully.
      headers:
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/Merchant"
    "401":
      description: Missing or invalid bearer JWT session.
      headers:
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
    "429":
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: "../components/headers.yaml#/RetryAfterResponseHeader"
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
    "500":
      description: Internal server error.
      headers:
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"

patch:
  summary: Update merchant profile settings
  description: Modifies merchant profile attributes such as business display name or default currency.
  operationId: updateMerchantMe
  tags:
    - Merchant Management
  security:
    - bearerJwt: []
  parameters:
    - $ref: "../components/headers.yaml#/IdempotencyKeyHeader"
    - $ref: "../components/headers.yaml#/XRequestIdHeader"
    - $ref: "../components/headers.yaml#/TraceparentHeader"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas.yaml#/UpdateMerchantRequest"
  responses:
    "200":
      description: Merchant profile updated successfully.
      headers:
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/Merchant"
    "400":
      description: Malformed request payload.
      headers:
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
    "401":
      description: Missing or invalid bearer JWT session.
      headers:
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
    "429":
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: "../components/headers.yaml#/RetryAfterResponseHeader"
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
    "500":
      description: Internal server error.
      headers:
        X-Request-Id:
          $ref: "../components/headers.yaml#/XRequestIdResponseHeader"
      content:
        application/problem+json:
          schema:
            $ref: "../components/problem.yaml#/ProblemDocument"
